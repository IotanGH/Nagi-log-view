<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nagi FFLogs 檢視器</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f0f1f4;
    --border: #e3e5ea;
    --text: #0b0b0b;
    --text-dim: #6b7078;
    --text-muted: #898781;
    --accent: #2a78d6;
    --accent-dim: #2a78d61a;
    --shadow: 0 1px 2px rgba(20, 22, 30, 0.04), 0 8px 24px rgba(20, 22, 30, 0.05);
    --radius: 16px;
    --role-melee: #2a78d6;
    --role-physranged: #eb6834;
    --role-magranged: #1baf7a;
    --role-tank: #eda100;
    --role-healer: #e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #212120;
      --border: #2c2c2a;
      --text: #ffffff;
      --text-dim: #c3c2b7;
      --text-muted: #898781;
      --accent: #3987e5;
      --accent-dim: #3987e526;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.4);
      --role-melee: #3987e5;
      --role-physranged: #d95926;
      --role-magranged: #199e70;
      --role-tank: #c98500;
      --role-healer: #d55181;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #212120; --border: #2c2c2a;
    --text: #ffffff; --text-dim: #c3c2b7; --text-muted: #898781;
    --accent: #3987e5; --accent-dim: #3987e526;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.4);
    --role-melee: #3987e5; --role-physranged: #d95926; --role-magranged: #199e70;
    --role-tank: #c98500; --role-healer: #d55181;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0f1f4; --border: #e3e5ea;
    --text: #0b0b0b; --text-dim: #6b7078; --text-muted: #898781;
    --accent: #2a78d6; --accent-dim: #2a78d61a;
    --shadow: 0 1px 2px rgba(20, 22, 30, 0.04), 0 8px 24px rgba(20, 22, 30, 0.05);
    --role-melee: #2a78d6; --role-physranged: #eb6834; --role-magranged: #1baf7a;
    --role-tank: #eda100; --role-healer: #e87ba4;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    padding: 56px 20px 100px;
    display: flex;
    justify-content: center;
    line-height: 1.5;
  }
  .wrap { width: 100%; max-width: 980px; }

  header.page-head {
    position: relative;
    overflow: hidden;
    margin-bottom: 28px;
    padding: 48px 40px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  header.page-head .hero-glow {
    position: absolute;
    inset: -60%;
    background:
      radial-gradient(circle at 12% 22%, var(--role-melee) 0%, transparent 40%),
      radial-gradient(circle at 82% 12%, var(--role-magranged) 0%, transparent 38%),
      radial-gradient(circle at 88% 82%, var(--role-healer) 0%, transparent 42%),
      radial-gradient(circle at 15% 90%, var(--role-tank) 0%, transparent 38%),
      radial-gradient(circle at 50% 50%, var(--role-physranged) 0%, transparent 46%);
    filter: blur(75px) saturate(140%);
    opacity: .3;
    pointer-events: none;
  }
  header.page-head .hero-content { position: relative; z-index: 1; }
  header.page-head h1 {
    font-size: 36px;
    font-weight: 800;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }
  header.page-head h1 .suffix {
    margin-left: 6px;
    color: var(--text-dim);
    font-weight: 550;
    font-size: 0.52em;
    letter-spacing: 0;
  }
  header.page-head p { margin: 0; color: var(--text-dim); font-size: 15px; }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  .toolbar .summary { font-size: 13.5px; color: var(--text-dim); }
  .toolbar .summary b { color: var(--text); font-weight: 700; }
  .toolbar-actions {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 7px 12px; border-radius: 12px;
    background: color-mix(in srgb, var(--accent) 8%, var(--surface-2));
    border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
  }
  .combine-link {
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border-radius: 8px;
    padding: 6px 13px;
    text-decoration: none;
    white-space: nowrap;
    transition: opacity .12s ease;
  }
  .combine-link:hover { opacity: .88; }
  .sort-control { display: flex; align-items: center; gap: 9px; }
  .sort-control label { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  .sort-control select {
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 9px;
    border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
    background: color-mix(in srgb, var(--accent) 12%, var(--surface));
    color: var(--text);
    cursor: pointer;
  }
  .sort-control select:hover { border-color: var(--accent); }
  .sort-control select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .group {
    margin-bottom: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .group-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 26px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, color-mix(in srgb, var(--group-color, var(--accent)) 14%, var(--surface)), var(--surface) 60%);
  }
  .group-dot {
    width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    background: var(--group-color, var(--accent));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--group-color, var(--accent)) 20%, transparent);
  }
  .group-title { font-size: 17.5px; font-weight: 750; letter-spacing: -0.01em; }
  .group-zone { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .group-count {
    margin-left: auto;
    font-size: 12px;
    padding: 3px 11px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  a.report-row {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 14px 26px;
    text-decoration: none;
    color: inherit;
    border-top: 1px solid var(--border);
    transition: background .12s ease;
  }
  a.report-row:hover { background: var(--surface-2); }
  a.report-row:hover .arrow { color: var(--accent); transform: translateX(2px); }

  .report-date {
    font-variant-numeric: tabular-nums;
    font-weight: 650;
    font-size: 14.5px;
    width: 100px;
    flex-shrink: 0;
  }
  .report-info { flex: 1; min-width: 0; }
  .report-title { font-size: 14.5px; font-weight: 600; }
  .report-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
  .report-stats {
    display: flex;
    gap: 14px;
    font-size: 12.5px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .report-stats .stat { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .arrow {
    color: var(--text-muted);
    font-size: 15px;
    flex-shrink: 0;
    transition: transform .12s ease, color .12s ease;
  }

  .empty-state {
    text-align: center;
    padding: 70px 30px;
    background: var(--surface);
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    color: var(--text-dim);
  }
  .empty-state .icon { font-size: 34px; margin-bottom: 12px; opacity: .8; }
  .empty-state .main { font-size: 15.5px; font-weight: 600; color: var(--text); }
  .empty-state .sub { font-size: 13.5px; margin-top: 6px; }

  @media (max-width: 640px) {
    .report-stats { display: none; }
    .report-date { width: 78px; font-size: 13px; }
  }
</style>

</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div class="hero-glow"></div>
    <div class="hero-content">
      <h1>Nagi<span class="suffix">FFLogs 檢視器</span></h1>
      <p>Custom FFLogs Collector and Viewer Presented by Tiramisu</p>
    </div>
  </header>

  <div class="toolbar">
    <div class="summary" id="summary"></div>
    <div class="toolbar-actions">
      <a class="combine-link" href="combine.html">跨報告合併統計 →</a>
      <div class="sort-control">
        <label for="sortSelect">日期排序</label>
        <select id="sortSelect">
          <option value="desc">新 → 舊</option>
          <option value="asc">舊 → 新</option>
        </select>
      </div>
    </div>
  </div>

  <div id="groups"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="icon">📭</div>
    <div class="main">還沒有任何解析完的報告</div>
    <div class="sub">執行 nagi.py 解析 FFLogs 報告後,這裡會自動列出結果</div>
  </div>
</div>

<script>
  const DATA = window.__NAGI_INDEX_DATA__ || [];
  const GROUP_PALETTE = ["--role-melee", "--role-physranged", "--role-magranged", "--role-tank", "--role-healer"];

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function hashColor(key) {
    let h = 0;
    for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
    return `var(${GROUP_PALETTE[h % GROUP_PALETTE.length]})`;
  }

  function render(order) {
    const groupsEl = document.getElementById("groups");
    const summaryEl = document.getElementById("summary");
    const emptyEl = document.getElementById("emptyState");

    if (!DATA.length) {
      groupsEl.innerHTML = "";
      summaryEl.textContent = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    const byInstance = new Map();
    for (const item of DATA) {
      const key = item.instance || "未分類";
      if (!byInstance.has(key)) byInstance.set(key, []);
      byInstance.get(key).push(item);
    }

    const dir = order === "asc" ? 1 : -1;
    const groups = [...byInstance.entries()].map(([name, items]) => {
      items.sort((a, b) => (a.date_ts - b.date_ts) * dir);
      const latest = Math.max(...items.map(i => i.date_ts));
      return { name, items, latest };
    });
    groups.sort((a, b) => (a.latest - b.latest) * dir);

    summaryEl.innerHTML = `共 <b>${DATA.length}</b> 份報告 · <b>${groups.length}</b> 個副本`;

    groupsEl.innerHTML = groups.map(g => `
      <div class="group" style="--group-color:${hashColor(g.name)}">
        <div class="group-head">
          <span class="group-dot"></span>
          <div>
            <div class="group-title">${escapeHtml(g.name)}</div>
            <div class="group-zone">${escapeHtml(g.items[0].zone || "")}</div>
          </div>
          <span class="group-count">${g.items.length} 份報告</span>
        </div>
        ${g.items.map(item => `
          <a class="report-row" href="${escapeHtml(item.html)}">
            <span class="report-date">${escapeHtml(item.date_display)}</span>
            <span class="report-info">
              <span class="report-title">${escapeHtml(item.title || g.name)}</span>
              <span class="report-sub">${escapeHtml(item.report_code || "")}</span>
            </span>
            <span class="report-stats">
              <span class="stat">⚔ ${item.fight_count} 場</span>
              <span class="stat">💀 ${item.kill_count} 擊殺</span>
              <span class="stat">👥 ${item.player_count} 人</span>
            </span>
            <span class="arrow">→</span>
          </a>
        `).join("")}
      </div>
    `).join("");
  }

  const sortSelect = document.getElementById("sortSelect");
  sortSelect.addEventListener("change", () => render(sortSelect.value));
  render(sortSelect.value);
</script>
</body>
</html>
