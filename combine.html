<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nagi FFLogs 檢視器</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f0f1f4;
    --border: #e3e5ea;
    --text: #0b0b0b;
    --text-dim: #6b7078;
    --text-muted: #898781;
    --accent: #2a78d6;
    --accent-dim: #2a78d61a;
    --shadow: 0 1px 2px rgba(20, 22, 30, 0.04), 0 8px 24px rgba(20, 22, 30, 0.05);
    --radius: 16px;
    --range-1: #2a78d6;
    --gold: #b8860b;
    --silver: #8a8f99;
    --bronze: #a9682f;
    --role-melee: #2a78d6;
    --role-physranged: #eb6834;
    --role-magranged: #1baf7a;
    --role-tank: #eda100;
    --role-healer: #e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #212120;
      --border: #2c2c2a;
      --text: #ffffff;
      --text-dim: #c3c2b7;
      --text-muted: #898781;
      --accent: #3987e5;
      --accent-dim: #3987e526;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.4);
      --range-1: #3987e5;
      --gold: #d9af49;
      --silver: #a3a8b0;
      --bronze: #c98a4b;
      --role-melee: #3987e5;
      --role-physranged: #d95926;
      --role-magranged: #199e70;
      --role-tank: #c98500;
      --role-healer: #d55181;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #212120; --border: #2c2c2a;
    --text: #ffffff; --text-dim: #c3c2b7; --text-muted: #898781;
    --accent: #3987e5; --accent-dim: #3987e526;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.4);
    --range-1: #3987e5; --gold: #d9af49; --silver: #a3a8b0; --bronze: #c98a4b;
    --role-melee: #3987e5; --role-physranged: #d95926; --role-magranged: #199e70;
    --role-tank: #c98500; --role-healer: #d55181;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f9f9f7; --surface: #fcfcfb; --surface-2: #f0f1f4; --border: #e3e5ea;
    --text: #0b0b0b; --text-dim: #6b7078; --text-muted: #898781;
    --accent: #2a78d6; --accent-dim: #2a78d61a;
    --shadow: 0 1px 2px rgba(20, 22, 30, 0.04), 0 8px 24px rgba(20, 22, 30, 0.05);
    --range-1: #2a78d6; --gold: #b8860b; --silver: #8a8f99; --bronze: #a9682f;
    --role-melee: #2a78d6; --role-physranged: #eb6834; --role-magranged: #1baf7a;
    --role-tank: #eda100; --role-healer: #e87ba4;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    padding: 56px 20px 100px;
    display: flex;
    justify-content: center;
    line-height: 1.5;
  }
  .wrap {
    width: 100%;
    max-width: 1320px;
  }

  header.page-head {
    position: relative;
    overflow: hidden;
    margin-bottom: 28px;
    padding: 52px 40px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  header.page-head .hero-glow {
    position: absolute;
    inset: -60%;
    background:
      radial-gradient(circle at 12% 22%, var(--role-melee) 0%, transparent 40%),
      radial-gradient(circle at 82% 12%, var(--role-magranged) 0%, transparent 38%),
      radial-gradient(circle at 88% 82%, var(--role-healer) 0%, transparent 42%),
      radial-gradient(circle at 15% 90%, var(--role-tank) 0%, transparent 38%),
      radial-gradient(circle at 50% 50%, var(--role-physranged) 0%, transparent 46%);
    filter: blur(75px) saturate(140%);
    opacity: .3;
    pointer-events: none;
  }
  header.page-head .hero-content { position: relative; z-index: 1; }
  header.page-head h1 {
    font-size: 40px;
    font-weight: 800;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  header.page-head h1 .suffix {
    margin-left: 6px;
    color: var(--text-dim);
    font-weight: 550;
    font-size: 0.52em;
    letter-spacing: 0;
  }
  header.page-head p {
    margin: 0;
    color: var(--text-dim);
    font-size: 15.5px;
  }

  .dropzone {
    background: var(--surface);
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 11px 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .dropzone .icon { font-size: 26px; line-height: 1; opacity: .85; flex-shrink: 0; }
  .dropzone .text { display: flex; flex-direction: column; }
  .dropzone .main { font-size: 15px; font-weight: 600; }
  .dropzone .sub { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; }
  .dropzone input[type="file"] { display: none; }

  .combine-panel {
    margin-bottom: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 30px;
  }
  .combine-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .combine-head h2 { margin: 0 0 4px; font-size: 19px; font-weight: 750; letter-spacing: -0.01em; }
  .combine-sub { margin: 0; font-size: 13px; color: var(--text-dim); }
  .back-link { font-size: 13px; color: var(--text-dim); text-decoration: none; white-space: nowrap; padding-top: 2px; }
  .back-link:hover { color: var(--accent); text-decoration: underline; }

  .instance-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .instance-tab {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color .12s ease, background .12s ease, color .12s ease;
  }
  .instance-tab .count { color: var(--text-muted); font-weight: 500; margin-left: 5px; }
  .instance-tab:hover { border-color: var(--accent); }
  .instance-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .instance-tab.active .count { color: rgba(255, 255, 255, .75); }

  .combine-list-head { display: flex; gap: 14px; margin-bottom: 8px; }
  .link-btn {
    font: inherit;
    font-size: 12.5px;
    font-weight: 650;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
  }
  .link-btn:hover { text-decoration: underline; }

  .combine-list { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .combine-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .combine-row:first-child { border-top: none; }
  .combine-row:hover { background: var(--surface-2); }
  .combine-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .combine-row .c-date { font-variant-numeric: tabular-nums; font-weight: 650; font-size: 13.5px; width: 92px; flex-shrink: 0; }
  .combine-row .c-info { flex: 1; min-width: 0; font-size: 13px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .combine-row .c-stats { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }

  .combine-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .combine-summary { font-size: 13px; color: var(--text-dim); }
  .combine-summary b { color: var(--text); font-weight: 700; }
  .btn-primary {
    font: inherit;
    font-size: 13.5px;
    font-weight: 650;
    padding: 9px 20px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: opacity .12s ease;
  }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }

  .combine-status-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
    padding: 12px 20px;
    border-radius: 12px;
    background: var(--accent-dim);
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-dim);
  }
  .combine-status-bar button {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .combine-status-bar button:hover { border-color: var(--accent); }

  .error-banner {
    display: none;
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 10px;
    background: #e5484d18;
    border: 1px solid #e5484d40;
    color: #e5484d;
    font-size: 14.5px;
  }

  .report-card {
    display: none;
    margin-top: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .accent-bar {
    height: 5px;
    background: linear-gradient(90deg,
      var(--role-melee), var(--role-physranged), var(--role-magranged),
      var(--role-tank), var(--role-healer));
  }

  .report-head {
    padding: 26px 30px;
    border-bottom: 1px solid var(--border);
  }
  .report-head .title-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 14px;
  }
  .report-head h2 { margin: 0 0 4px; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .report-head .meta { font-size: 14px; color: var(--text-dim); }
  .sort-control { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
  .sort-control label { font-size: 13px; color: var(--text-dim); white-space: nowrap; }
  .sort-control select {
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
  }
  .sort-control select:hover { border-color: var(--accent); }
  .sort-control select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fight-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .fight-tag {
    font-size: 12.5px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
    white-space: nowrap;
    cursor: default;
  }
  .fight-tag.wipe { color: var(--text-muted); }

  .legend-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 22px;
    padding: 14px 30px;
    font-size: 13px;
    color: var(--text-dim);
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .legend-bar .item { display: flex; align-items: center; gap: 7px; }
  .legend-swatch { display: inline-block; border-radius: 3px; flex-shrink: 0; }
  .legend-swatch.wash { width: 20px; height: 8px; background: color-mix(in srgb, var(--range-1) 18%, transparent); }
  .legend-swatch.band { width: 20px; height: 8px; background: color-mix(in srgb, var(--range-1) 48%, transparent); }
  .legend-swatch.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--range-1); }
  .legend-swatch.cap { width: 2px; height: 13px; background: var(--range-1); border-radius: 1px; }

  .role-section + .role-section { border-top: 1px solid var(--border); }
  .role-heading {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 30px 12px;
  }
  .role-badge {
    width: 30px; height: 30px;
    border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800;
    color: #fff;
    flex-shrink: 0;
  }
  .role-badge.MeleeDPS { background: var(--role-melee); color: #fff; }
  .role-badge.PhysRanged { background: var(--role-physranged); color: #fff; }
  .role-badge.MagRanged { background: var(--role-magranged); color: #fff; }
  .role-badge.Tank { background: var(--role-tank); color: #241900; }
  .role-badge.Healer { background: var(--role-healer); color: #2e0a1a; }
  .role-badge.Other { background: var(--text-muted); color: #fff; }
  .role-title { font-size: 17px; font-weight: 750; }
  .role-count { font-size: 13px; color: var(--text-muted); }

  table.dps-table { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.dps-table thead th {
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-dim);
    font-weight: 650;
    padding: 12px 30px;
    background: var(--surface-2);
  }
  table.dps-table thead th.num { text-align: right; }
  table.dps-table thead th.headline-col { text-align: left; }
  table.dps-table thead th.dist { min-width: 230px; }
  table.dps-table th:not(:first-child),
  table.dps-table td:not(:first-child) {
    border-left: 1px solid var(--border);
  }
  table.dps-table tbody tr.player-row {
    --job-dark: color-mix(in srgb, var(--job-color, #888) 55%, black 45%);
    border-top: 1px solid var(--border);
    cursor: pointer;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--job-dark) 26%, var(--surface)) 0%,
      var(--surface) 36%);
    transition: background .15s ease;
  }
  table.dps-table tbody tr.player-row:hover {
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--job-dark) 38%, var(--surface-2)) 0%,
      var(--surface-2) 36%);
  }
  table.dps-table td { padding: 16px 22px; vertical-align: middle; }

  td.rank { width: 44px; }
  .rank-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px;
    border-radius: 50%;
    font-variant-numeric: tabular-nums;
    font-size: 14px; font-weight: 700;
    color: var(--text-dim);
  }
  .rank-badge.top1 { background: var(--gold); border-color: transparent; color: #2b1d00; font-weight: 800; box-shadow: 0 2px 6px color-mix(in srgb, var(--gold) 50%, transparent); }
  .rank-badge.top2 { background: var(--silver); border-color: transparent; color: #1c1e21; font-weight: 800; box-shadow: 0 2px 6px color-mix(in srgb, var(--silver) 45%, transparent); }
  .rank-badge.top3 { background: var(--bronze); border-color: transparent; color: #2a1400; font-weight: 800; box-shadow: 0 2px 6px color-mix(in srgb, var(--bronze) 45%, transparent); }

  .player-cell { display: flex; align-items: center; gap: 12px; }
  .job-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 2px var(--surface); }
  .player-link { color: var(--text); text-decoration: none; font-weight: 650; font-size: 16px; }
  .player-link:hover { color: var(--accent); text-decoration: underline; }
  .job-name { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); margin-top: 3px; }
  .fight-count-badge {
    font-size: 11.5px;
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .range-viz { display: flex; flex-direction: column; gap: 6px; min-width: 230px; }
  .range-row { display: flex; align-items: center; gap: 8px; }
  .range-num { font-size: 12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .range-num.min-num { width: 48px; text-align: right; }
  .range-num.max-num { width: 48px; text-align: left; }
  .range-track {
    position: relative;
    flex: 1;
    height: 24px;
  }
  .range-track .track-line {
    position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: var(--border); transform: translateY(-50%);
  }
  .range-band-full {
    position: absolute; top: 50%; height: 7px; border-radius: 3.5px;
    background: color-mix(in srgb, var(--range-1) 22%, transparent);
    transform: translateY(-50%);
    z-index: 1;
  }
  .range-band-std {
    position: absolute; top: 50%; height: 7px; border-radius: 3.5px;
    background: color-mix(in srgb, var(--range-1) 60%, transparent);
    transform: translateY(-50%);
    z-index: 2;
  }
  .range-cap {
    position: absolute; top: 50%; width: 2px; height: 16px;
    background: var(--range-1);
    border-radius: 1px;
    transform: translate(-50%, -50%);
    z-index: 3;
  }
  .range-avg-dot {
    position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%;
    background: var(--range-1);
    box-shadow: 0 0 0 2px var(--surface), 0 1px 2px rgba(0,0,0,.2);
    transform: translate(-50%, -50%);
    z-index: 4;
  }
  .range-caption { font-size: 13px; color: var(--text-dim); padding-left: 56px; }
  .range-caption b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }

  th.headline-col { white-space: nowrap; }
  td.headline-col { text-align: center; white-space: nowrap; }
  .headline-value {
    position: relative;
    display: inline-block;
    font-size: 16.5px;
    font-weight: 560;
    color: #eef6ff;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    padding: 1px 8px;
    z-index: 1;
  }
  .headline-value::before {
    content: "";
    position: absolute;
    inset: 0 -22px;
    background: rgba(0, 0, 0, 0.3);
    -webkit-mask-image: linear-gradient(to right, transparent, #000 20%, #000 80%, transparent);
    mask-image: linear-gradient(to right, transparent, #000 20%, #000 80%, transparent);
    z-index: -1;
    pointer-events: none;
  }

  td.fight-src a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 14px;
    white-space: nowrap;
  }
  td.fight-src a:hover { color: var(--accent); text-decoration: underline; }

  tr.detail-row td {
    padding: 0 30px 20px;
    border-top: none;
  }
  tr.detail-row.hidden { display: none; }
  .detail-box {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 13.5px;
  }
  .detail-box table { width: 100%; border-collapse: collapse; }
  .detail-box th {
    text-align: left; font-weight: 650; color: var(--text-muted);
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
    padding: 6px 10px;
  }
  .detail-box th.num, .detail-box td.num { text-align: right; }
  .detail-box td { padding: 7px 10px; font-variant-numeric: tabular-nums; }
  .detail-box tr.best-fight td { font-weight: 700; color: var(--accent); }
  .detail-box a { color: inherit; text-decoration: none; }
  .detail-box a:hover { text-decoration: underline; }

  .trend { margin-bottom: 18px; }
  .trend-head {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 16px;
    margin-bottom: 10px;
  }
  .trend-head .t-title {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-muted); font-weight: 650;
  }
  .trend-legend { display: flex; gap: 14px; }
  .trend-legend .lg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .trend-legend .sw { width: 16px; height: 0; border-top: 2px solid currentColor; display: inline-block; }
  .trend-legend .sw.dashed { border-top-style: dashed; }
  .trend-chart { width: 100%; height: auto; display: block; overflow: visible; }
  .trend-chart .grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 2 4; opacity: .7; }
  .trend-chart .axis { stroke: var(--border); stroke-width: 1; }

<div class="wrap">
  <header class="page-head">
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="hero-content">
      <h1>Nagi<span class="suffix">FFLogs 檢視器</span></h1>
      <p>Custom FFLogs Collector and Viewer Presented by Tiramisu</p>
    </div>
  </header>

  <section class="combine-panel" id="combine-panel" style="display:none">
    <div class="combine-head">
      <div>
        <h2>選擇要合併統計的報告</h2>
        <p class="combine-sub">同一副本、不同日期的紀錄可以合併,一起計算每位玩家跨場次的整體表現</p>
      </div>
      <a class="back-link" href="index.html">← 報告總覽</a>
    </div>
    <div class="instance-tabs" id="instance-tabs"></div>
    <div class="combine-list-head">
      <button type="button" class="link-btn" id="combine-select-all">全選</button>
      <button type="button" class="link-btn" id="combine-select-none">全不選</button>
    </div>
    <div class="combine-list" id="combine-list"></div>
    <div class="combine-actions">
      <div class="combine-summary" id="combine-summary">尚未選擇任何報告</div>
      <button type="button" class="btn-primary" id="combine-run" disabled>合併並檢視</button>
    </div>
  </section>

  <label class="dropzone" id="dropzone" for="file-input">
    <div class="icon">📊</div>
    <div class="text">
      <div class="main" id="dropzone-main">點擊選擇,或拖曳 JSON 檔案到這裡</div>
      <div class="sub">限用 nagi.py 產出的 json</div>
    </div>
    <input type="file" id="file-input" accept="application/json,.json">
  </label>

  <div class="error-banner" id="error-banner"></div>

  <section class="report-card" id="report-card">
    <div class="accent-bar"></div>
    <div class="report-head">
      <div class="title-row">
        <div>
          <h2 id="report-title">—</h2>
          <div class="meta" id="report-meta">—</div>
        </div>
        <div class="sort-control">
          <label for="sort-select">排序依據</label>
          <select id="sort-select">
            <option value="rdps_max">最高 rDPS</option>
            <option value="rdps_avg">平均 rDPS</option>
            <option value="dps_max">最高 DPS</option>
            <option value="dps_avg">平均 DPS</option>
          </select>
        </div>
      </div>
      <div class="fight-tags" id="fight-tags"></div>
    </div>
    <div class="legend-bar">
      <span class="item"><span class="legend-swatch cap"></span> 最低 ／ 最高</span>
      <span class="item"><span class="legend-swatch wash"></span> 全距</span>
      <span class="item"><span class="legend-swatch band"></span> 平均 ± 1 標準差</span>
      <span class="item"><span class="legend-swatch dot"></span> 平均值</span>
      <span class="item">點列可展開各場明細</span>
    </div>
    <div id="role-tables"></div>
    <div class="empty-state" id="empty-state" style="display:none;">這份資料裡沒有有效的玩家紀錄(可能所選場次的 DPS 都是 0)。</div>
  </section>

  <footer class="hint">資料完全在瀏覽器本機解析,不會上傳到任何伺服器。</footer>
</div>

<div id="tooltip"></div>

<script>
(function () {
  const JOB_COLORS = {
    Paladin: "#a8d2e6", Warrior: "#cf2621", DarkKnight: "#d126cc", Gunbreaker: "#796d30",
    WhiteMage: "#fff0dc", Scholar: "#8657ff", Astrologian: "#ffe74a", Sage: "#80a0f0",
    Monk: "#d69c00", Dragoon: "#4164cd", Ninja: "#af1964", Samurai: "#e46d04",
    Viper: "#12a688", Reaper: "#965a90", Bard: "#91ba5e", Machinist: "#6ee1d6",
    Dancer: "#e2b0af", BlackMage: "#a579d6", Summoner: "#2d9b78", RedMage: "#e87b7b",
    Pictomancer: "#f5a4c7", BlueMage: "#2c7791",
  };
  const JOB_LABEL_ZH = {
    Paladin: "騎士", Warrior: "戰士", DarkKnight: "暗黑騎士", Gunbreaker: "絕槍戰士",
    WhiteMage: "白魔法師", Scholar: "學者", Astrologian: "占星術士", Sage: "賢者",
    Monk: "武僧", Dragoon: "龍騎士", Ninja: "忍者", Samurai: "武士",
    Viper: "毒蛇劍士", Reaper: "鐮刀死神", Bard: "吟遊詩人", Machinist: "機工士",
    Dancer: "舞者", BlackMage: "黑魔法師", Summoner: "召喚師", RedMage: "赤魔法師",
    Pictomancer: "繪靈法師", BlueMage: "青魔法師",
  };
  const JOB_ROLE = {
    Paladin: "Tank", Warrior: "Tank", DarkKnight: "Tank", Gunbreaker: "Tank",
    WhiteMage: "Healer", Scholar: "Healer", Astrologian: "Healer", Sage: "Healer",
    Monk: "MeleeDPS", Dragoon: "MeleeDPS", Ninja: "MeleeDPS", Samurai: "MeleeDPS",
    Viper: "MeleeDPS", Reaper: "MeleeDPS",
    Bard: "PhysRanged", Machinist: "PhysRanged", Dancer: "PhysRanged",
    BlackMage: "MagRanged", Summoner: "MagRanged", RedMage: "MagRanged",
    Pictomancer: "MagRanged", BlueMage: "MagRanged",
  };
  const ROLE_ORDER = ["MeleeDPS", "PhysRanged", "MagRanged", "Tank", "Healer", "Other"];
  const ROLE_LABEL = {
    MeleeDPS: "近戰輸出", PhysRanged: "遠程物理", MagRanged: "遠程法師",
    Tank: "坦克", Healer: "治療", Other: "其他",
  };
  const ROLE_BADGE = {
    MeleeDPS: "近", PhysRanged: "物", MagRanged: "法",
    Tank: "T", Healer: "H", Other: "?",
  };

  const dropzone = document.getElementById("dropzone");
  const dropzoneMain = document.getElementById("dropzone-main");
  const fileInput = document.getElementById("file-input");
  const errorBanner = document.getElementById("error-banner");
  const reportCard = document.getElementById("report-card");
  const reportTitle = document.getElementById("report-title");
  const reportMeta = document.getElementById("report-meta");
  const fightTags = document.getElementById("fight-tags");
  const roleTables = document.getElementById("role-tables");
  const emptyState = document.getElementById("empty-state");
  const tooltip = document.getElementById("tooltip");
  const sortSelect = document.getElementById("sort-select");

  let lastData = null;
  let sortMode = sortSelect.value;

  function showError(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = "block";
    reportCard.style.display = "none";
  }
  function clearError() { errorBanner.style.display = "none"; }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }
  function fmtNum(n) {
    if (typeof n !== "number" || Number.isNaN(n)) return "—";
    return n.toLocaleString("en-US", { maximumFractionDigits: 0 });
  }
  function ms_to_clock(ms) {
    const total = Math.floor(ms / 1000);
    const m = Math.floor(total / 60), s = total % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function mean(arr) { return arr.reduce((a, b) => a + b, 0) / arr.length; }
  function stdev(arr, avg) {
    if (arr.length < 2) return 0;
    const variance = arr.reduce((sum, x) => sum + (x - avg) ** 2, 0) / (arr.length - 1);
    return Math.sqrt(variance);
  }

  function groupByPlayer(entries) {
    const map = new Map();
    for (const e of entries) {
      const key = e.name;
      if (!map.has(key)) map.set(key, { name: e.name, jobCounts: {}, records: [] });
      const g = map.get(key);
      g.jobCounts[e.job] = (g.jobCounts[e.job] || 0) + 1;
      g.records.push(e);
    }
    const players = [];
    for (const g of map.values()) {
      const job = Object.entries(g.jobCounts).sort((a, b) => b[1] - a[1])[0][0];
      const rdpsValues = g.records.map(r => r.rdps);
      const dpsValues = g.records.map(r => r.dps);
      const avgRdps = mean(rdpsValues);
      const avgDps = mean(dpsValues);
      const best = g.records.reduce((a, b) => (b.rdps > a.rdps ? b : a));
      players.push({
        name: g.name,
        job,
        records: g.records,
        n: g.records.length,
        minRdps: Math.min(...rdpsValues),
        maxRdps: Math.max(...rdpsValues),
        avgRdps,
        stdevRdps: stdev(rdpsValues, avgRdps),
        minDps: Math.min(...dpsValues),
        maxDps: Math.max(...dpsValues),
        avgDps,
        stdevDps: stdev(dpsValues, avgDps),
        best,
      });
    }
    return players;
  }

  const SORT_OPTIONS = {
    rdps_max: { label: "最高 rDPS", get: p => p.maxRdps },
    rdps_avg: { label: "平均 rDPS", get: p => p.avgRdps },
    dps_max: { label: "最高 DPS", get: p => p.maxDps },
    dps_avg: { label: "平均 DPS", get: p => p.avgDps },
  };

  function positionTooltip(x, y) {
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }

  // 每位玩家的「表現—時間」折線圖:每場戰鬥一個折點,依時間先後(records 的原始順序,
  // 單一報告內為戰鬥順序、合併模式為各報告依日期串接)排列。rDPS 一條線、DPS 一條淡虛線,
  // 內嵌成 SVG(不依賴外部函式庫),滑鼠移到點上用共用 tooltip 顯示該場細節。
  function createTrendChart(records, jobColor, playerName) {
    const wrap = document.createElement("div");
    wrap.className = "trend";

    if (!records.length) {
      wrap.innerHTML = `<div class="trend-empty">無資料</div>`;
      return wrap;
    }

    const rdps = records.map(r => r.rdps);
    const dps = records.map(r => r.dps);
    const avgRdps = rdps.reduce((a, b) => a + b, 0) / rdps.length;

    const W = 760, H = 220;
    const padL = 54, padR = 14, padT = 14, padB = 30;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const n = records.length;

    const allVals = rdps.concat(dps);
    let yMin = Math.min(...allVals);
    let yMax = Math.max(...allVals);
    const pad = (yMax - yMin) * 0.12 || yMax * 0.1 || 1;
    yMin = Math.max(0, yMin - pad);
    yMax = yMax + pad;

    const xFor = i => n === 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
    const yFor = v => padT + (1 - (v - yMin) / (yMax - yMin)) * plotH;

    // 水平格線 + y 軸數值
    const GRID_N = 4;
    let grid = "";
    for (let g = 0; g <= GRID_N; g++) {
      const val = yMin + (g / GRID_N) * (yMax - yMin);
      const y = yFor(val);
      grid += `<line class="grid" x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}"></line>`;
      grid += `<text class="grid-label" x="${padL - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end">${fmtNum(val)}</text>`;
    }

    const linePts = vals => vals.map((v, i) => `${xFor(i).toFixed(1)},${yFor(v).toFixed(1)}`).join(" ");
    const rdpsPath = n > 1 ? `<polyline class="series rdps" points="${linePts(rdps)}" stroke="${jobColor}"></polyline>` : "";
    const dpsPath = n > 1 ? `<polyline class="series dps" points="${linePts(dps)}" stroke="var(--text-dim)"></polyline>` : "";

    const avgY = yFor(avgRdps);
    const avgLine = `<line class="avg-line" x1="${padL}" y1="${avgY.toFixed(1)}" x2="${W - padR}" y2="${avgY.toFixed(1)}" stroke="${jobColor}"></line>`;

    // x 軸標籤:點多時只標首、末與中間幾個,避免擠成一團
    const maxLabels = 8;
    const step = Math.max(1, Math.ceil(n / maxLabels));
    let xLabels = "";
    records.forEach((r, i) => {
      if (n > 1 && i % step !== 0 && i !== n - 1) return;
      const label = r._date ? r._date.slice(5) : `#${r.fight_id ?? i + 1}`;
      xLabels += `<text class="x-label" x="${xFor(i).toFixed(1)}" y="${H - 10}" text-anchor="middle">${escapeHtml(label)}</text>`;
    });

    // 資料點(rDPS 實心、DPS 空心)+ 較大的透明命中區,方便滑鼠停留
    let dots = "";
    records.forEach((r, i) => {
      const x = xFor(i).toFixed(1);
      dots += `<circle class="pt" cx="${x}" cy="${yFor(r.dps).toFixed(1)}" r="2.6" fill="var(--surface)" stroke="var(--text-dim)" stroke-width="1.4"></circle>`;
      dots += `<circle class="pt" cx="${x}" cy="${yFor(r.rdps).toFixed(1)}" r="3.4" fill="${jobColor}"></circle>`;
      dots += `<circle class="pt-hit" data-i="${i}" cx="${x}" cy="${yFor(r.rdps).toFixed(1)}" r="12"></circle>`;
    });

    wrap.innerHTML = `
      <div class="trend-head">
        <span class="t-title">表現趨勢(每場一點,依時間排列)</span>
        <span class="trend-legend">
          <span class="lg" style="color:${jobColor}"><span class="sw"></span>rDPS</span>
          <span class="lg"><span class="sw dashed"></span>DPS</span>
        </span>
      </div>
      <svg class="trend-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
           aria-label="${escapeHtml(playerName)} 每場表現折線圖">
        ${grid}
        ${avgLine}
        ${dpsPath}
        ${rdpsPath}
        ${dots}
        ${xLabels}
      </svg>
    `;

    const svg = wrap.querySelector("svg");
    svg.querySelectorAll(".pt-hit").forEach(hit => {
      const r = records[+hit.dataset.i];
      hit.addEventListener("mousemove", e => {
        tooltip.innerHTML =
          `${escapeHtml(playerName)}${r._date ? ` · ${escapeHtml(r._date)}` : ""}<br>` +
          `#${escapeHtml(r.fight_id ?? "?")} ${escapeHtml(r.fight_name || "")}<br>` +
          `rDPS <b>${fmtNum(r.rdps)}</b> ／ DPS <b>${fmtNum(r.dps)}</b>`;
        tooltip.classList.add("show");
        positionTooltip(e.clientX, e.clientY);
      });
      hit.addEventListener("mouseleave", () => tooltip.classList.remove("show"));
    });

    return wrap;
  }

  function createRangeViz(label, min, avg, max, sd, toPct, n, playerName) {
    const minPct = toPct(min);
    const maxPct = toPct(max);
    const bandLoPct = toPct(Math.max(min, avg - sd));
    const bandHiPct = toPct(Math.min(max, avg + sd));
    const avgPct = toPct(avg);

    const wrap = document.createElement("div");
    wrap.className = "range-viz";
    wrap.innerHTML = `
      <div class="range-row">
        <span class="range-num min-num">${fmtNum(min)}</span>
        <div class="range-track">
          <div class="track-line"></div>
          <div class="range-band-full" style="left:${minPct}%; width:${Math.max(0, maxPct - minPct)}%"></div>
          <div class="range-band-std" style="left:${bandLoPct}%; width:${Math.max(0, bandHiPct - bandLoPct)}%"></div>
          <div class="range-cap" style="left:${minPct}%"></div>
          <div class="range-cap" style="left:${maxPct}%"></div>
          <div class="range-avg-dot" style="left:${avgPct}%"></div>
        </div>
        <span class="range-num max-num">${fmtNum(max)}</span>
      </div>
      <div class="range-caption">平均 <b>${fmtNum(avg)}</b> ± ${fmtNum(sd)}</div>
    `;

    wrap.addEventListener("mousemove", e => {
      tooltip.innerHTML = `${escapeHtml(playerName)} · ${label}<br>` +
        `最低 <b>${fmtNum(min)}</b> ／ 平均 <b>${fmtNum(avg)}</b> ／ 最高 <b>${fmtNum(max)}</b><br>` +
        `標準差 <b>${fmtNum(sd)}</b> ・ 共 ${n} 場`;
      tooltip.classList.add("show");
      positionTooltip(e.clientX, e.clientY);
    });
    wrap.addEventListener("mouseleave", () => tooltip.classList.remove("show"));

    return wrap;
  }

  function buildPlayerRow(p, rank, toPctRdps, toPctDps, sortOpt) {
    const rankClass = rank === 1 ? "top1" : rank === 2 ? "top2" : rank === 3 ? "top3" : "";
    const headlineValue = sortOpt.get(p);
    const jobColor = JOB_COLORS[p.job] || "#8b8f99";
    const jobLabel = JOB_LABEL_ZH[p.job] || p.job || "?";
    const link = p.best.link || "#";

    const tr = document.createElement("tr");
    tr.className = "player-row";
    tr.style.setProperty("--job-color", jobColor);
    tr.innerHTML = `
      <td class="rank"><span class="rank-badge ${rankClass}">${rank}</span></td>
      <td>
        <div class="player-cell">
          <span class="job-dot" style="background:${jobColor}"></span>
          <div>
            <a class="player-link" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(p.name)}</a>
            <div class="job-name">${escapeHtml(jobLabel)} <span class="fight-count-badge">${p.n} 場</span></div>
          </div>
        </div>
      </td>
      <td class="headline-col">
        <span class="headline-value">${fmtNum(headlineValue)}</span>
      </td>
      <td class="rdps-cell"></td>
      <td class="dps-cell"></td>
      <td class="fight-src">
        <a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">#${escapeHtml(p.best.fight_id ?? "?")} ${escapeHtml(p.best.fight_name || "")}</a>
      </td>
    `;

    tr.querySelector(".rdps-cell").appendChild(
      createRangeViz("rDPS", p.minRdps, p.avgRdps, p.maxRdps, p.stdevRdps, toPctRdps, p.n, p.name)
    );
    tr.querySelector(".dps-cell").appendChild(
      createRangeViz("DPS", p.minDps, p.avgDps, p.maxDps, p.stdevDps, toPctDps, p.n, p.name)
    );

    const detailTr = document.createElement("tr");
    detailTr.className = "detail-row hidden";
    const sortedRecords = [...p.records].sort((a, b) => b.rdps - a.rdps);
    const detailRows = sortedRecords.map(r => {
      const isBest = r === p.best;
      return `<tr class="${isBest ? "best-fight" : ""}">
        <td><a href="${escapeHtml(r.link)}" target="_blank" rel="noopener noreferrer">#${escapeHtml(r.fight_id)} ${escapeHtml(r.fight_name)}</a>${isBest ? " ★" : ""}</td>
        <td class="num">${fmtNum(r.rdps)}</td>
        <td class="num">${fmtNum(r.dps)}</td>
      </tr>`;
    }).join("");
    detailTr.innerHTML = `
      <td colspan="6">
        <div class="detail-box">
          <div class="detail-chart"></div>
          <table>
            <thead><tr><th>場次</th><th class="num">rDPS</th><th class="num">DPS</th></tr></thead>
            <tbody>${detailRows}</tbody>
          </table>
        </div>
      </td>
    `;
    detailTr.querySelector(".detail-chart").appendChild(
      createTrendChart(p.records, jobColor, p.name)
    );

    tr.addEventListener("click", e => {
      if (e.target.closest("a")) return;
      detailTr.classList.toggle("hidden");
    });

    return [tr, detailTr];
  }

  function makeScale(mins, maxs) {
    const globalMin = Math.min(...mins);
    const globalMax = Math.max(...maxs);
    const domainPad = (globalMax - globalMin) * 0.06 || globalMax * 0.05 || 1;
    const domainMin = Math.max(0, globalMin - domainPad);
    const domainMax = globalMax + domainPad;
    return v => Math.min(100, Math.max(0, ((v - domainMin) / (domainMax - domainMin)) * 100));
  }

  function buildRoleSection(role, players, sortOpt) {
    const toPctRdps = makeScale(players.map(p => p.minRdps), players.map(p => p.maxRdps));
    const toPctDps = makeScale(players.map(p => p.minDps), players.map(p => p.maxDps));

    const section = document.createElement("div");
    section.className = "role-section";
    section.innerHTML = `
      <div class="role-heading">
        <span class="role-badge ${role}">${ROLE_BADGE[role]}</span>
        <span class="role-title">${ROLE_LABEL[role]}</span>
        <span class="role-count">${players.length} 人</span>
      </div>
      <table class="dps-table">
        <thead>
          <tr>
            <th>#</th>
            <th>玩家</th>
            <th class="num headline-col">${escapeHtml(sortOpt.label)}</th>
            <th class="dist">rDPS 分佈</th>
            <th class="dist">DPS 分佈</th>
            <th>最佳場次</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    `;
    const tbody = section.querySelector("tbody");
    players.forEach((p, idx) => {
      const [tr, detailTr] = buildPlayerRow(p, idx + 1, toPctRdps, toPctDps, sortOpt);
      tbody.appendChild(tr);
      tbody.appendChild(detailTr);
    });
    return section;
  }

  function fflogsReportUrl(data) {
    if (!data.report_code) return null;
    const withLink = (data.entries || []).find(e => e.link);
    if (withLink) {
      const m = withLink.link.match(/^(https?:\/\/[^/]+\/reports\/[^/#?]+)/);
      if (m) return m[1];
    }
    return `https://www.fflogs.com/reports/${data.report_code}`;
  }

  function render(data) {
    if (!data || typeof data !== "object" || !Array.isArray(data.entries)) {
      throw new Error("這個 JSON 不是預期的 best_dps 格式(缺少 entries 陣列)");
    }

    reportTitle.textContent = data.report_title || data.report_code || "未命名報告";
    const metaParts = [];
    if (data.zone_name) metaParts.push(escapeHtml(data.zone_name));
    if (data.report_code) {
      const reportUrl = fflogsReportUrl(data);
      metaParts.push(reportUrl
        ? `代碼: <a href="${escapeHtml(reportUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(data.report_code)}</a>`
        : `代碼: ${escapeHtml(data.report_code)}`);
    } else if (Array.isArray(data.report_sources) && data.report_sources.length) {
      const chips = data.report_sources.map(s => s.url && s.url !== "#"
        ? `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.label)}</a>`
        : escapeHtml(s.label)
      ).join(", ");
      metaParts.push(`來源: ${chips}`);
    }
    reportMeta.innerHTML = metaParts.join("  ·  ") || "—";

    fightTags.innerHTML = "";
    (data.fights || []).forEach(f => {
      const tag = document.createElement("span");
      tag.className = "fight-tag" + (f.kill ? "" : " wipe");
      tag.textContent = `#${f.id} ${f.name || ""}` + (f.kill ? " ✓" : "");
      if (typeof f.combat_time_ms === "number") {
        tag.title = `戰鬥時長: ${ms_to_clock(f.combat_time_ms)}` +
          (!f.kill && f.boss_percentage != null ? `  ·  剩餘 ${f.boss_percentage}%` : "");
      }
      fightTags.appendChild(tag);
    });

    // rDPS 或 DPS 接近 0 的紀錄視為無效(例如亂開的短暫嘗試、中途才加入就死等),
    // 排除、不計入該玩家的統計。真實輸出不可能低於 1,用 <1 判斷可以順便濾掉
    // 那種存檔時四捨五入前是 0.x、顯示出來卻是 "0" 的邊界值。
    const validEntries = (data.entries || []).filter(e => e.dps >= 1 && e.rdps >= 1);
    const players = groupByPlayer(validEntries);
    const sortOpt = SORT_OPTIONS[sortMode] || SORT_OPTIONS.rdps_max;
    players.sort((a, b) => sortOpt.get(b) - sortOpt.get(a));
    roleTables.innerHTML = "";

    if (players.length === 0) {
      emptyState.style.display = "block";
    } else {
      emptyState.style.display = "none";

      const byRole = {};
      for (const p of players) {
        const role = JOB_ROLE[p.job] || "Other";
        (byRole[role] = byRole[role] || []).push(p);
      }

      ROLE_ORDER.forEach(role => {
        const list = byRole[role];
        if (!list || list.length === 0) return;
        roleTables.appendChild(buildRoleSection(role, list, sortOpt));
      });
    }

    reportCard.style.display = "block";
  }

  function handleFile(file) {
    if (!file) return;
    clearError();
    dropzoneMain.textContent = file.name;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        lastData = data;
        render(data);
      } catch (err) {
        showError("讀取失敗: " + err.message);
      }
    };
    reader.onerror = () => showError("無法讀取檔案。");
    reader.readAsText(file, "utf-8");
  }

  fileInput.addEventListener("change", e => handleFile(e.target.files[0]));
  sortSelect.addEventListener("change", () => {
    sortMode = sortSelect.value;
    if (lastData) render(lastData);
  });

  ["dragenter", "dragover"].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add("drag"); })
  );
  ["dragleave", "drop"].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove("drag"); })
  );
  dropzone.addEventListener("drop", e => {
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  // nagi.py 可以把資料直接內嵌成 window.__NAGI_DATA__ 產生一份現撈報告,
  // 這種情況下開頁就直接渲染,不需要使用者手動選檔(仍可拖新檔案覆蓋)。
  if (typeof window.__NAGI_DATA__ !== "undefined" && window.__NAGI_DATA__) {
    lastData = window.__NAGI_DATA__;
    dropzoneMain.textContent = "已載入現撈資料(可拖曳其他 JSON 覆蓋)";
    render(lastData);
  }

  // ---- 跨報告合併統計(combine.html 專用,由 nagi.py 內嵌 __NAGI_COMBINE_DATA__ 觸發)----
  // 同一副本、不同日期的報告可以合併,一起計算每位玩家跨場次的整體表現。
  // 個別報告頁(__NAGI_DATA__)不會帶這份資料,這段程式碼在那些頁面上就直接跳過。
  (function initCombineMode() {
    const reports = window.__NAGI_COMBINE_DATA__;
    if (!Array.isArray(reports) || !reports.length) return;

    const panel = document.getElementById("combine-panel");
    const tabsEl = document.getElementById("instance-tabs");
    const listEl = document.getElementById("combine-list");
    const summaryEl = document.getElementById("combine-summary");
    const runBtn = document.getElementById("combine-run");
    const selectAllBtn = document.getElementById("combine-select-all");
    const selectNoneBtn = document.getElementById("combine-select-none");
    panel.style.display = "block";

    const byInstance = new Map();
    for (const r of reports) {
      const key = r.instance || "未分類";
      if (!byInstance.has(key)) byInstance.set(key, []);
      byInstance.get(key).push(r);
    }
    for (const list of byInstance.values()) list.sort((a, b) => b.date_ts - a.date_ts);
    const instances = [...byInstance.keys()].sort((a, b) =>
      Math.max(...byInstance.get(b).map(r => r.date_ts)) - Math.max(...byInstance.get(a).map(r => r.date_ts))
    );

    let activeInstance = instances[0];
    const selected = new Set();

    function renderTabs() {
      tabsEl.innerHTML = instances.map(name => `
        <button type="button" class="instance-tab${name === activeInstance ? " active" : ""}" data-instance="${escapeHtml(name)}">
          ${escapeHtml(name)}<span class="count">${byInstance.get(name).length}</span>
        </button>
      `).join("");
      tabsEl.querySelectorAll(".instance-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          activeInstance = btn.dataset.instance;
          selected.clear();
          renderTabs();
          renderList();
          renderSummary();
        });
      });
    }

    function renderList() {
      const items = byInstance.get(activeInstance) || [];
      listEl.innerHTML = items.map(r => `
        <label class="combine-row">
          <input type="checkbox" data-html="${escapeHtml(r.html)}" ${selected.has(r.html) ? "checked" : ""}>
          <span class="c-date">${escapeHtml(r.date_display)}</span>
          <span class="c-info">${escapeHtml(r.title || r.instance || "")} · ${escapeHtml(r.report_code || "")}</span>
          <span class="c-stats">
            <span>⚔ ${r.fight_count}</span>
            <span>💀 ${r.kill_count}</span>
            <span>👥 ${r.player_count}</span>
          </span>
        </label>
      `).join("");
      listEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener("change", () => {
          if (cb.checked) selected.add(cb.dataset.html);
          else selected.delete(cb.dataset.html);
          renderSummary();
        });
      });
    }

    function renderSummary() {
      const n = selected.size;
      summaryEl.innerHTML = n ? `已選 <b>${n}</b> 份報告` : "尚未選擇任何報告";
      runBtn.disabled = n < 1;
    }

    selectAllBtn.addEventListener("click", () => {
      (byInstance.get(activeInstance) || []).forEach(r => selected.add(r.html));
      renderList();
      renderSummary();
    });
    selectNoneBtn.addEventListener("click", () => {
      selected.clear();
      renderList();
      renderSummary();
    });

    function showCombineStatusBar(n, instanceName) {
      let bar = document.getElementById("combine-status-bar");
      if (!bar) {
        bar = document.createElement("div");
        bar.id = "combine-status-bar";
        bar.className = "combine-status-bar";
        panel.insertAdjacentElement("afterend", bar);
      }
      bar.innerHTML = `
        <span>目前顯示:<b>${escapeHtml(instanceName)}</b> 合併統計(${n} 份報告)</span>
        <button type="button" id="combine-reselect">← 重新選擇</button>
      `;
      bar.style.display = "flex";
      document.getElementById("combine-reselect").addEventListener("click", () => {
        bar.style.display = "none";
        reportCard.style.display = "none";
        panel.style.display = "block";
      });
    }

    runBtn.addEventListener("click", () => {
      const items = (byInstance.get(activeInstance) || []).filter(r => selected.has(r.html));
      if (!items.length) return;
      items.sort((a, b) => a.date_ts - b.date_ts);

      const combinedPayload = {
        report_title: `${activeInstance} · 合併 ${items.length} 份報告`,
        zone_name: items[0].zone || "",
        fights: items.flatMap(r => r.fights || []),
        // 幫每筆紀錄標上來源報告的日期,趨勢圖 x 軸才能用日期標示是哪一天的哪一場
        entries: items.flatMap(r => (r.entries || []).map(e => ({ ...e, _date: r.date_display }))),
        report_sources: items.map(r => ({ label: r.date_display, url: fflogsReportUrl(r) || "#" })),
      };

      lastData = combinedPayload;
      panel.style.display = "none";
      showCombineStatusBar(items.length, activeInstance);
      render(combinedPayload);
      reportCard.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    renderTabs();
    renderList();
    renderSummary();
  })();
})();
</script>
</body>
</html>
